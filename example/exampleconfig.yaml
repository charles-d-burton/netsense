      - service: "Zoom TCP Control"
        direction: "dst"
        protocols: ["tcp"]
        portranges: ["80", "443", "8801", "8802"]
        cidrs:
          - "3.7.35.0/25"
          - "3.21.137.128/25"
          - "3.22.11.0/24"
          - "3.23.93.0/24"
