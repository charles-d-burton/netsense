          - "134.224.0.0/16"
          - "144.195.0.0/16"
          - "147.124.96.0/19"
          - "147.124.128.0/19"
          - "149.137.0.0/16"
          - "158.120.0.0/16"
          - "160.1.0.0/16"
          - "162.255.36.0/22"
          - "170.114.0.0/16"
          - "173.199.0.0/18"
          - "192.204.12.0/22"
