  - name: "Teams"
    homeassistant:
      name: "Teams Meeting"
      device_class: "connectivity"
      state_topic: "homeassistant/binary_sensor/teams/state"
      availability_topic: "homeassistant/binary_sensor/teams/availability"
      unique_id: "netsense_teams_01"

    pcap:
      active_threshold: 5
      on_delay: 2s
      off_delay: 30s

    filters:
      - service: "Teams Media (Audio/Video)"
        direction: "both"
        protocols: ["udp"]
        portranges: ["3478-3481"]
        cidrs:
          - "13.107.64.0/18"
          - "52.112.0.0/14"
          - "52.120.0.0/14"

  - name: "Streaming"
    homeassistant:
      name: "Netflix Active"
      device_class: "connectivity"
      state_topic: "homeassistant/binary_sensor/netflix/state"
      availability_topic: "homeassistant/binary_sensor/netflix/availability"
      unique_id: "netsense_netflix_01"

    pcap:
      active_threshold: 10
      on_delay: 10s
      off_delay: 60s

    filters:
      - service: "Netflix Traffic"
        direction: "dst"
        protocols: ["tcp"]
        portranges: ["443"]
        cidrs:
          - "23.246.0.0/18"
          - "45.57.0.0/17"
