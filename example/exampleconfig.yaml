# NetSense Configuration
mqtt:
  host: "192.168.100.2"
  port: "1883"
  user: "mqtt_user"
  password: "mqtt_password"
  client_id: "laptop"
  connect_timeout: 4s
  ping_interval: 30s
  reconnect_backoff: 1s
  payload_active: "ON"
  payload_inactive: "OFF"
  payload_available: "online"
  payload_not_available: "offline"
  tls: false

device:
  name: "Work Laptop"
  model: "NetSense Monitor"
  manufacturer: "NetSense"
  identifiers: ["my_laptop_netsense"]

sensors:
  - name: "Zoom"
    homeassistant:
      name: "Zoom Meeting"
      device_class: "connectivity"
      state_topic: "homeassistant/binary_sensor/zoom/state"
      availability_topic: "homeassistant/binary_sensor/zoom/availability"
      unique_id: "netsense_zoom_01"

    pcap:
      active_threshold: 5
      on_delay: 2s
      off_delay: 30s

    filters:
      - service: "Zoom UDP Media"
        direction: "both"
        protocols: ["udp"]
        portranges: ["3478", "3479", "8801-8810"]
        cidrs:
          - "3.7.35.0/25"
          - "3.21.137.128/25"
          - "3.22.11.0/24"
