# Zoom active meeting sensor
# Detects active Zoom audio/video by monitoring bidirectional UDP media traffic.
# Ports 3478/3479 are STUN/TURN (meeting setup); 8801-8802 are Zoom's media relay ports.
#
# IP ranges sourced from:
#   https://support.zoom.us/hc/en-us/articles/201362683
# Verify against current documentation — Zoom updates these periodically.
#
# Add this entry to the sensors: list in your config.yaml.

- name: "Zoom"
  homeassistant:
    name: "Zoom Meeting"
    device_class: "connectivity"
    state_topic: "homeassistant/binary_sensor/zoom/state"
    availability_topic: "homeassistant/binary_sensor/zoom/availability"
    unique_id: "netsense_zoom_01"

  pcap:
    active_threshold: 5
    on_delay: 2s
    off_delay: 30s

  filters:
    - service: "Zoom UDP Media"
      direction: "both"
      protocols: ["udp"]
      portranges: ["3478", "3479", "8801", "8802"]
      cidrs:
        # Americas
        - "3.7.35.0/25"
        - "3.21.137.128/25"
        - "3.22.11.0/24"
        - "3.23.93.0/24"
        - "3.25.41.0/24"
        - "3.25.48.0/24"
        - "3.80.20.0/23"
        - "3.101.32.0/23"
        - "3.235.64.0/19"
        - "13.52.146.0/24"
        - "18.172.115.0/24"
        - "50.202.0.0/16"
        - "64.125.62.0/24"
        - "64.211.144.0/24"
        - "69.174.57.0/24"
        - "162.255.36.0/22"
        - "173.199.0.0/18"
        - "192.204.12.0/22"
        - "198.16.126.0/23"
        - "204.141.28.0/22"
        - "206.247.0.0/18"
        - "207.226.132.0/24"
        - "209.9.211.0/24"
        # Europe
        - "103.122.166.0/23"
        - "134.224.0.0/16"
        - "144.195.0.0/16"
        - "147.124.96.0/19"
        - "147.124.128.0/19"
        - "149.137.0.0/16"
        - "158.120.0.0/16"
        - "160.1.0.0/16"
        - "170.114.0.0/16"
        # Asia-Pacific
        - "115.114.115.0/24"
        - "115.114.131.0/24"
        - "120.29.148.0/24"
        - "202.177.200.0/24"
        - "213.19.144.0/20"
        - "221.122.88.0/23"
